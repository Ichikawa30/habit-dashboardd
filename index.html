<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Habit Dashboard Pro MAX</title>

<style>

body{
background:#0f172a;
font-family:Arial;
color:white;
margin:0;
padding:15px;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
}

h1{margin-bottom:10px;}

button{
padding:10px 20px;
margin:10px;
border:none;
border-radius:8px;
background:#22c55e;
cursor:pointer;
font-weight:bold;
}

/* circle */
.circle{
width:120px;
height:120px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
margin:15px auto;
font-size:18px;
font-weight:bold;
background:conic-gradient(#22c55e 0deg,#1e293b 0deg);
}

/* month bar */
.progressBox{
height:18px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
}

.progressFill{
height:100%;
width:0%;
background:#22c55e;
transition:0.4s;
}

/* table */
table{
width:100%;
border-collapse:collapse;
margin-top:20px;
font-size:12px;
}

th,td{
border:1px solid #334155;
padding:4px;
}

th{background:#1e293b;}

.habitName{text-align:left;padding-left:6px;}

input{transform:scale(1.1);cursor:pointer;}

.streak{
font-size:11px;
color:#facc15;
}

</style>
</head>

<body>

<div class="container">

<h1>Habit Dashboard</h1>

<button onclick="resetHabits()">RESET 🔁</button>

<div class="circle" id="circle">0%</div>
<p id="todayStats">0 / 0 Today</p>

<div class="progressBox">
<div class="progressFill" id="monthBar"></div>
</div>
<p id="monthText">0% Monthly</p>

<table>
<thead>
<tr>
<th>Habit</th>
<script>
for(let i=1;i<=30;i++){
document.write("<th>"+i+"</th>")
}
</script>
</tr>
</thead>

<tbody id="habitBody"></tbody>

</table>

</div>

<script>

const habits=[
"Wake Up Early",
"Workout",
"Study",
"Reading",
"Meditation",
"No Junk Food",
"Cold Shower (exception when not well)"
]

const today=new Date().getDate()

const habitBody=document.getElementById("habitBody")

habits.forEach((habit,i)=>{

let row=document.createElement("tr")

let name=document.createElement("td")
name.className="habitName"

let streak=document.createElement("div")
streak.className="streak"
streak.id="streak-"+i

name.innerHTML=habit
name.appendChild(streak)

row.appendChild(name)

for(let d=1;d<=30;d++){

let td=document.createElement("td")
let check=document.createElement("input")
check.type="checkbox"

let key="habit-"+i+"-"+d

if(localStorage.getItem(key)=="1"){
check.checked=true
}

check.addEventListener("change",()=>{
localStorage.setItem(key,check.checked?"1":"0")
update()
})

td.appendChild(check)
row.appendChild(td)

}

habitBody.appendChild(row)

})

function update(){

// DAILY
let doneToday=0

habits.forEach((h,i)=>{
if(localStorage.getItem("habit-"+i+"-"+today)=="1"){
doneToday++
}
})

let dailyPercent=Math.round((doneToday/habits.length)*100)
let deg=(dailyPercent/100)*360

document.getElementById("circle").style.background=
`conic-gradient(#22c55e ${deg}deg,#1e293b ${deg}deg)`

document.getElementById("circle").innerText=dailyPercent+"%"
document.getElementById("todayStats").innerText=
doneToday+" / "+habits.length+" Today"


// MONTH
let total=habits.length*30
let done=0

for(let i=0;i<habits.length;i++){
for(let d=1;d<=30;d++){
if(localStorage.getItem("habit-"+i+"-"+d)=="1"){
done++
}
}
}

let percent=Math.round((done/total)*100)

document.getElementById("monthBar").style.width=percent+"%"
document.getElementById("monthText").innerText=percent+"% Monthly"


// STREAK
habits.forEach((h,i)=>{
let streak=0

for(let d=today;d>=1;d--){
if(localStorage.getItem("habit-"+i+"-"+d)=="1"){
streak++
}else break
}

document.getElementById("streak-"+i).innerText="🔥 "+streak
})

}


// AUTO DAILY RESET
function checkReset(){
let last=localStorage.getItem("lastDate")
let now=new Date().toDateString()

if(last!==now){

habits.forEach((h,i)=>{
localStorage.removeItem("habit-"+i+"-"+today)
})

localStorage.setItem("lastDate",now)
}
}

function resetHabits(){
if(confirm("Reset EVERYTHING?")){
localStorage.clear()
location.reload()
}
}

checkReset()
update()

</script>

</body>
</html>
